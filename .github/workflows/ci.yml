name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Measure coverage
        run: npm run test:coverage

      - name: Build package
        run: npm run build

      - name: Check package contents
        run: npm pack ./dist --dry-run

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  node-runtime:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and integration tests
        run: npm run test

  bun-runtime:
    name: Bun runtime
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun built-package smoke test
        run: bun scripts/smoke-core.mjs

  deno-runtime:
    name: Deno runtime
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.x

      - name: Check built public entry
        run: deno check --no-config --no-lock --node-modules-dir=manual dist/index.js

      - name: Run Deno built-package smoke test
        run: deno run --no-config --no-lock --node-modules-dir=manual --allow-read --allow-env scripts/smoke-core.mjs

  browser-bundle:
    name: Browser bundle
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bundle built public entry for browser
        run: >-
          ./node_modules/.bin/esbuild dist/index.js
          --bundle --platform=browser --format=esm
          --outfile=/tmp/hyperttp-core-browser.js

      - name: Run Chromium built-package smoke test
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -n "$CHROMIUM_PATH"
          node scripts/smoke-chromium.mjs --core-only

  package-consumer:
    name: Package consumer Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org

      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Create package tarball
        run: npm pack ./dist --pack-destination /tmp

      - name: Install tarball in a clean project
        working-directory: /tmp
        run: |
          mkdir hyperttp-consumer
          cd hyperttp-consumer
          npm init --yes
          npm pkg set type=module
          npm install ../hyperttp-core-*.tgz typescript@^7 @types/node@20

      - name: Import public entry points and execute a request
        working-directory: /tmp/hyperttp-consumer
        run: >-
          node --input-type=module --eval '
          const { HyperCore } = await import("@hyperttp/core");
          await import("@hyperttp/core/rest");
          const transport = {
            protocols: ["rest"],
            execute: async (request) => ({
              status: 200,
              headers: { "content-type": "application/json" },
              url: request.url,
              body: new TextEncoder().encode("{\"installed\":true}"),
            }),
          };
          const core = new HyperCore({ customTransport: transport });
          const response = await core.rest.get("https://example.test/");
          if (response.data?.installed !== true) throw new Error("Tarball runtime failed");
          await core.destroy();
          '

      - name: Compile consumer TypeScript
        working-directory: /tmp/hyperttp-consumer
        run: |
          cat > index.ts <<'EOF'
          import { HyperCore } from "@hyperttp/core";
          import type { CorePluginFactory, ServerRequestOutcome } from "@hyperttp/types";
          import type { RestRequestOptions } from "@hyperttp/core/rest";

          const options: RestRequestOptions = { timeout: 1000 };
          const factory: CorePluginFactory = () => ({ name: "consumer", onServerSettled(outcome) { const result: ServerRequestOutcome = outcome; void result; } });
          const core = new HyperCore({ pluginFactories: [factory] });
          void core.rest.get("https://example.test", options);
          EOF
          ./node_modules/.bin/tsc index.ts \
            --noEmit \
            --strict \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext
